type Avaliacao {
  id: String!
  nota: Int!
  comentario: String
  usuario: Usuario!
  aluguel: Aluguel!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateAvaliacaoInput {
  nota: Int!
  comentario: String
  aluguelId: String!
  usuarioId: String!
}

input UpdateAvaliacaoInput {
  nota: Int
  comentario: String
  aluguelId: String
  usuarioId: String
}